[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "atris-tools"
dynamic = ["version"]
description = "Python preparation and post-processing tools for AtRIS"
dependencies = [
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "requests",
]

[project.scripts]
atris = "atris_tools.cli:main"
nrlmsis2psf = "atris_tools.nrlmsis2psf:main"
psf2gdml = "atris_tools.simtools:psf2gdml_main"
atrismacrogen = "atris_tools.atrismacrogen:main"
atris-gather = "atris_tools.gather:main"
postprocess = "atris_tools.postprocess:main"
bin2ascii = "atris_tools.bin2asci:main"

[tool.setuptools]
packages = ["atris_tools"]

[tool.setuptools.package-data]
atris_tools = ["data/*"]
