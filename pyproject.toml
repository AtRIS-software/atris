[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "atris-tools"
dynamic = ["version"]
description = "Python preparation and post-processing tools for AtRIS"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.scripts]
atris-version = "atris_tools.version_command:main"
atris-nrlmsis-to-psf = "atris_tools.nrlmsis2psf:main"
atris-psf-to-gdml = "atris_tools.psf2gdml:main"
atris-generate-macros = "atris_tools.atrismacrogen:main"
atris-stage-phantoms = "atris_tools.phantoms:main"
atris-clone = "atris_tools.clone_run:main"
atris-scatter = "atris_tools.scatter:main"
atris-run = "atris_tools.run_chunks:main"
atris-gather = "atris_tools.gather:main"
atris-postprocess = "atris_tools.postprocess:main"
atris-plot = "atris_tools.plotting:main"
atris-bin-to-ascii = "atris_tools.bin2asci:main"

# Legacy command names.
nrlmsis2psf = "atris_tools.nrlmsis2psf:main"
psf2gdml = "atris_tools.psf2gdml:main"
atrismacrogen = "atris_tools.atrismacrogen:main"
postprocess = "atris_tools.postprocess:main"
bin2ascii = "atris_tools.bin2asci:main"

[tool.setuptools]
packages = ["atris_tools"]

[tool.setuptools.package-data]
atris_tools = ["data/*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "regression: requires AtRIS on PATH and a loaded Geant4 runtime",
]
