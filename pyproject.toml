[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atris-tools"
version = "0.0.0"
description = "Python preparation and post-processing tools for AtRIS"
dependencies = [
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "requests",
]

[project.scripts]
nrlmsis2psf = "nrlmsis2psf:main"
psf2gdml = "simtools:psf2gdml_main"
atrismacrogen = "atrismacrogen:main"
postprocess = "postprocess:main"

[tool.setuptools]
packages = ["atris_tools"]
py-modules = [
    "atrismacrogen",
    "nrlmsis2psf",
    "postprocess",
    "simtools",
]
