name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Python 3.10 fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run fast tests
        run: python -m pytest tests/python

      - name: Check shell-script syntax
        run: |
          bash -n examples/run-atris.slurm.sh
          bash -n examples/run-atris-singleton.slurm.sh

  regression-tests:
    name: AtRIS regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
      GEANT4_VERSION: "11.4.2"
      GEANT4_SOURCE_SHA256: f9d5c7d108ae6be644d12997e0289e23e5d2da18df1cab9aaacd9b76412dfec6
      GEANT4_CACHE_KEY: geant4-ubuntu-24.04-x64-gcc13-11.4.2-gdml-mt-data-v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gcc-13 g++-13 libxerces-c-dev

      - name: Configure Geant4 installation path
        id: geant4-path
        run: |
          install_prefix="$(realpath -m "$GITHUB_WORKSPACE/../geant4-v${GEANT4_VERSION}/install")"
          echo "install-prefix=$install_prefix" >> "$GITHUB_OUTPUT"
          echo "GEANT4_INSTALL_PREFIX=$install_prefix" >> "$GITHUB_ENV"

      - name: Restore Geant4
        id: geant4-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.geant4-path.outputs.install-prefix }}
          key: ${{ env.GEANT4_CACHE_KEY }}

      - name: Build and install Geant4
        if: steps.geant4-cache.outputs.cache-hit != 'true'
        run: |
          source_archive="$RUNNER_TEMP/geant4-v${GEANT4_VERSION}.tar.gz"
          source_directory="$RUNNER_TEMP/geant4-v${GEANT4_VERSION}"
          build_directory="$RUNNER_TEMP/geant4-build"

          curl --fail --location --retry 3 \
            --output "$source_archive" \
            "https://gitlab.cern.ch/geant4/geant4/-/archive/v${GEANT4_VERSION}/geant4-v${GEANT4_VERSION}.tar.gz"
          echo "${GEANT4_SOURCE_SHA256}  ${source_archive}" | sha256sum --check --strict
          tar -xzf "$source_archive" -C "$RUNNER_TEMP"

          cmake \
            -S "$source_directory" \
            -B "$build_directory" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEANT4_INSTALL_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DGEANT4_USE_GDML=ON \
            -DGEANT4_BUILD_MULTITHREADED=ON \
            -DGEANT4_INSTALL_DATA=ON \
            -DGEANT4_INSTALL_DATA_TIMEOUT=1800 \
            -DGEANT4_INSTALL_EXAMPLES=OFF
          cmake --build "$build_directory" --parallel 2
          cmake --install "$build_directory"

      - name: Verify Geant4
        run: |
          source "$GEANT4_INSTALL_PREFIX/bin/geant4.sh"
          test "$(geant4-config --version)" = "$GEANT4_VERSION"
          geant4-config --has-feature gdml
          geant4-config --has-feature multithreading
          geant4-config --check-datasets

      - name: Save Geant4
        if: steps.geant4-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.geant4-path.outputs.install-prefix }}
          key: ${{ env.GEANT4_CACHE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Build AtRIS
        run: |
          source ./setup_atris.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run AtRIS regression tests
        run: |
          source ./setup_atris.sh
          export G4FORCENUMBEROFTHREADS=1
          python -m pytest tests/regression
